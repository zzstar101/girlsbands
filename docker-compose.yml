# docker compose up -d --build     → http://localhost:3000   (the admin is at /admin)
# docker compose --profile https up -d --build   → HTTPS for SITE_DOMAIN through Caddy; with
#   CADDYFILE=Caddyfile.edgeone the same Caddy is the origin behind EdgeOne (see docs/deploy.md).
name: girlsbands

x-app: &app
  image: girlsbands-app
  env_file: .env
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgres://girlsbands:${POSTGRES_PASSWORD:-girlsbands}@db:5432/girlsbands
    GIRLSBANDS_DATA_DIR: /data
    API_BASE_URL: http://api:3001
  volumes:
    - data:/data
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: girlsbands
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-girlsbands}
      POSTGRES_DB: girlsbands
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U girlsbands -d girlsbands"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Applies the database migrations and seeds the sources, then exits. This is the one service that
  # declares the build: all four share the image above, and when each of them builds it, a cold build
  # exports the same tag four times at once and fails with `image "…:latest": already exists`. Compose
  # builds every image before it starts any container, so api, worker and web still get the fresh one.
  setup:
    <<: *app
    build:
      context: .
      args:
        # Absolute CDN host for the hashed client assets (empty: this origin). Only a build arg, so it
        # takes effect on `docker compose build`, not on restart.
        ASSET_BASE_URL: ${ASSET_BASE_URL:-}
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]

  api:
    <<: *app
    command: ["node", "apps/api/src/main.ts"]
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: "3001"
    # /api/health reads the database, so this is a readiness probe, not just a liveness one: `web` waits
    # on it below, which is what keeps the first page load from reaching Fastify before it is listening.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      setup:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["node", "apps/worker/src/main.ts"]
    # On stop the worker lets a paid call in flight finish (STOP_TIMEOUT_MS, 195 s); Docker's default
    # 10 s would kill it mid-call and leave "outcome unknown" receipts that are paid for again.
    stop_grace_period: 210s
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: ["node", "apps/web/server.ts"]
    environment:
      <<: *app-env
      WEB_HOST: 0.0.0.0
      WEB_PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      # 80/443 by default. When a CDN or another web server terminates TLS in front of this host, publish
      # high ports instead (CADDY_HTTP_PORT=18080 CADDY_HTTPS_PORT=18443) and point that proxy at them.
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      # Host of the CDN asset host and the secret EdgeOne adds on back-to-origin; only used when
      # CADDYFILE selects deploy/Caddyfile.edgeone.
      STATIC_DOMAIN: ${STATIC_DOMAIN:-}
      ORIGIN_AUTH_SECRET: ${ORIGIN_AUTH_SECRET:-}
    volumes:
      - ./deploy/${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - web

volumes:
  db: {}
  data: {}
  caddy: {}
